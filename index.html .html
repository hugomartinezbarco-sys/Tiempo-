<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiempo en el Monte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mapa topográfico a pantalla completa + panel de lectura (abajo en móvil, lateral en escritorio) */
:root{
  --bg:#eef1f0; --panel:#fbfcfb; --ink:#1d2a2c; --muted:#5e6d6f; --line:#d5dcda;
  --accent:#c8501e; --cold:#2f6fa6; --rain:#2c7fb8; --chip:#e4eae8;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121a1b; --panel:#182224; --ink:#e3ebea; --muted:#93a4a5; --line:#2b3a3c;
  --accent:#ee7a45; --cold:#79b2e6; --rain:#6bb8ea; --chip:#223033; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);display:flex;flex-direction:column;overflow:hidden}
#map{flex:1 1 45%;min-height:200px}
#panel{flex:1 1 55%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:860px){body{flex-direction:row-reverse}#panel{flex:0 0 430px;border-top:0;border-right:1px solid var(--line)}#map{flex:1}}
.search{position:absolute;z-index:1000;top:calc(10px + env(safe-area-inset-top,0px));left:max(54px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:420px}
.search input{width:100%;font:15px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);box-shadow:0 2px 8px #0002}
.results{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:4px;overflow:hidden}
.results button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:13px var(--body);cursor:pointer}
h1{font:700 26px/1.05 var(--display);margin:0;text-wrap:balance;letter-spacing:.2px}
h2{font:700 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.meta{color:var(--muted);font-size:13px;margin-top:3px}
.alt{font:500 13px var(--mono);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{font:600 13px var(--body);padding:8px 12px;border-radius:7px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;margin-top:12px}
.big{font:700 56px/1 var(--display)}
.ico{font-size:40px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:10px}
.fact b{display:block;font:500 15px var(--mono)}
.fact span{font-size:12px;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.h{flex:0 0 62px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:12px}
.h .t{font:700 17px var(--display)}
.h .r{color:var(--rain);font:500 11px var(--mono)}
.h .w{color:var(--muted);font:500 11px var(--mono)}
.h.day0{border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px}
.mono{font-family:var(--mono)}
.rain{color:var(--rain)} .cold{color:var(--cold)} .hot{color:var(--accent)}
.arrow{display:inline-block}
.wrap{overflow-x:auto}
.hint{color:var(--muted);font-size:13px}
.empty{padding:6px 0}
input[type=range]{width:100%;accent-color:var(--accent)}
.src{margin-top:22px;font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}
.err{color:var(--accent)}
</style>
</head>
<body>
<div id="map"></div>
<div class="search">
  <input id="q" type="search" placeholder="Buscar sitio o pico… (ej. Ocejón)" autocomplete="off">
  <div id="res" class="results" hidden></div>
</div>
<div id="panel">
  <div class="row" style="margin-top:0">
    <button class="btn on" id="mPoint">📍 Punto</button>
    <button class="btn" id="mRoute">⛰️ Subida / ruta</button>
    <button class="btn" id="ocejon">Ocejón</button>
  </div>
  <div id="out"><p class="hint empty">Pincha en cualquier punto del mapa para ver el tiempo ahí, ajustado a la altitud real del sitio.</p></div>
  <p class="src">Datos: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (modelos ECMWF, ICON, AROME/Météo-France, GFS) · Mapa © <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a>, OpenStreetMap</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const OCEJON = {lat:41.10569, lon:-3.25409, name:"Pico Ocejón"};
// Subida clásica desde Majaelrayo (puntos aproximados del camino; la altitud se calcula sola)
const SUBIDA = [
  [41.1108,-3.3013,"Majaelrayo (salida)"],
  [41.1099,-3.2905,"Arroyo / inicio senda"],
  [41.1088,-3.2790,"Media ladera"],
  [41.1077,-3.2690,"Collado"],
  [41.1066,-3.2605,"Cuerda final"],
  [OCEJON.lat,OCEJON.lon,"Cumbre Ocejón"]
];
const WMO = {0:["☀️","Despejado"],1:["🌤️","Casi despejado"],2:["⛅","Nubes y claros"],3:["☁️","Cubierto"],45:["🌫️","Niebla"],48:["🌫️","Niebla con escarcha"],
51:["🌦️","Llovizna débil"],53:["🌦️","Llovizna"],55:["🌧️","Llovizna fuerte"],56:["🌧️","Llovizna helada"],57:["🌧️","Llovizna helada"],
61:["🌧️","Lluvia débil"],63:["🌧️","Lluvia"],65:["🌧️","Lluvia fuerte"],66:["🌧️","Lluvia helada"],67:["🌧️","Lluvia helada"],
71:["🌨️","Nieve débil"],73:["🌨️","Nieve"],75:["❄️","Nieve fuerte"],77:["🌨️","Granizo fino"],80:["🌦️","Chubascos"],81:["🌧️","Chubascos"],82:["⛈️","Chubascos fuertes"],
85:["🌨️","Chubascos de nieve"],86:["❄️","Chubascos de nieve"],95:["⛈️","Tormenta"],96:["⛈️","Tormenta con granizo"],99:["⛈️","Tormenta con granizo"]};
const ico=(c,day=1)=>{let w=WMO[c]||["❔","—"];if(!day&&c<=1)return["🌙",w[1]];return w};
const DIRS=["N","NE","E","SE","S","SO","O","NO"];
const dir=d=>DIRS[Math.round(d/45)%8];
const arrow=d=>`<span class="arrow" style="transform:rotate(${d+180}deg)">↑</span>`;
const r0=x=>x==null?"–":Math.round(x);
const r1=x=>x==null?"–":(Math.round(x*10)/10).toString().replace(".",",");
const tcls=t=>t<=0?"cold":t>=28?"hot":"";
const $=id=>document.getElementById(id);
const out=$("out");

const map=L.map("map",{zoomControl:true}).setView([41.1,-3.27],11);
L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:"© OpenTopoMap, © OpenStreetMap"}).addTo(map);
let mode="point", marker=null, routeLayer=L.layerGroup().addTo(map), routePts=[];

function setMode(m){mode=m;$("mPoint").classList.toggle("on",m==="point");$("mRoute").classList.toggle("on",m==="route");
  routeLayer.clearLayers();routePts=[];if(marker){map.removeLayer(marker);marker=null}
  out.innerHTML=m==="point"?`<p class="hint empty">Pincha en cualquier punto del mapa para ver el tiempo ahí.</p>`
  :`<p class="hint empty">Pincha varios puntos de tu subida (salida, collado, cumbre…) y verás qué tiempo hará en cada uno a la hora que elijas.</p><div class="row"><button class="btn" onclick="loadSubida()">Cargar subida al Ocejón desde Majaelrayo</button></div>`}
$("mPoint").onclick=()=>setMode("point");
$("mRoute").onclick=()=>setMode("route");
$("ocejon").onclick=()=>{setMode("point");map.setView([OCEJON.lat,OCEJON.lon],13);pointWeather(OCEJON.lat,OCEJON.lon,OCEJON.name)};

map.on("click",e=>{const {lat,lng}=e.latlng;
  if(mode==="point")pointWeather(lat,lng);
  else{routePts.push([lat,lng,"Punto "+(routePts.length+1)]);drawRoute();routeWeather()}});

async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function placeName(lat,lon){try{const j=await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=14&accept-language=es`);
  const a=j.address||{};return [a.peak||j.name||a.village||a.town||a.city||a.hamlet,a.county||a.state].filter(Boolean).join(", ")||null}catch{return null}}

const HOURLY="temperature_2m,apparent_temperature,weather_code,precipitation,precipitation_probability,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,freezing_level_height,snowfall,is_day";

async function pointWeather(lat,lon,name){
  if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map);
  out.innerHTML=`<p class="hint">Cargando tiempo…</p>`;
  try{
    const base=`latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&timezone=auto`;
    const [f,cmp,nm]=await Promise.all([
      getJSON(`https://api.open-meteo.com/v1/forecast?${base}&forecast_days=7&current=temperature_2m,apparent_temperature,weather_code,cloud_cover,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m,relative_humidity_2m,is_day&hourly=${HOURLY}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset`),
      getJSON(`https://api.open-meteo.com/v1/forecast?${base}&forecast_days=3&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_gusts_10m_max&models=ecmwf_ifs025,icon_seamless,meteofrance_seamless,gfs_seamless`).catch(()=>null),
      name?Promise.resolve(name):placeName(lat,lon)]);
    renderPoint(f,cmp,nm,lat,lon);
  }catch(e){out.innerHTML=`<p class="err">No he podido cargar el tiempo (sin conexión o servicio caído). Prueba otra vez en un momento.</p>`}
}

function renderPoint(f,cmp,nm,lat,lon){
  const c=f.current,h=f.hourly,d=f.daily;
  const [ic,txt]=ico(c.weather_code,c.is_day);
  const nowIdx=Math.max(0,h.time.findIndex(t=>t>=c.time.slice(0,13)));
  let hrs="";
  for(let i=nowIdx;i<nowIdx+36&&i<h.time.length;i++){
    const t=h.time[i].slice(11,16),p=h.precipitation[i],pp=h.precipitation_probability[i],sn=h.snowfall[i];
    hrs+=`<div class="h ${t==="00:00"?"day0":""}"><div>${t==="00:00"?dayName(h.time[i]):t}</div><div style="font-size:20px">${ico(h.weather_code[i],h.is_day[i])[0]}</div>
    <div class="t ${tcls(h.temperature_2m[i])}">${r0(h.temperature_2m[i])}°</div>
    <div class="r">${sn>0?r1(sn)+"cm❄":p>0?r1(p)+"mm":"&nbsp;"}</div><div class="r">${pp!=null?pp+"%":""}</div>
    <div class="w">${arrow(h.wind_direction_10m[i])}${r0(h.wind_speed_10m[i])}</div></div>`}
  let days="";
  d.time.forEach((t,i)=>{days+=`<tr><td>${i===0?"Hoy":dayName(t)}</td><td style="font-size:18px">${ico(d.weather_code[i])[0]}</td>
    <td class="mono"><span class="cold">${r0(d.temperature_2m_min[i])}°</span> / <span class="${tcls(d.temperature_2m_max[i])}">${r0(d.temperature_2m_max[i])}°</span></td>
    <td class="mono rain">${d.precipitation_sum[i]>0?r1(d.precipitation_sum[i])+" mm":"–"} <small>${d.precipitation_probability_max[i]??""}${d.precipitation_probability_max[i]!=null?"%":""}</small></td>
    <td class="mono">${arrow(d.wind_direction_10m_dominant[i])} ${r0(d.wind_speed_10m_max[i])} <small>(${r0(d.wind_gusts_10m_max[i])})</small></td></tr>`});
  const fl=h.freezing_level_height[nowIdx];
  out.innerHTML=`<h1>${nm||"Punto seleccionado"}</h1>
  <div class="meta"><span class="alt">${r0(f.elevation)} m</span> · ${lat.toFixed(4)}, ${lon.toFixed(4)}</div>
  <div class="now"><div class="ico">${ic}</div><div><div class="big ${tcls(c.temperature_2m)}">${r1(c.temperature_2m)}°</div><div>${txt} · sensación ${r0(c.apparent_temperature)}°</div></div></div>
  <div class="facts">
    <div class="fact"><b>${arrow(c.wind_direction_10m)} ${r0(c.wind_speed_10m)} km/h ${dir(c.wind_direction_10m)}</b><span>Viento · rachas ${r0(c.wind_gusts_10m)} km/h</span></div>
    <div class="fact"><b class="rain">${r1(c.precipitation)} mm</b><span>Lluvia ahora</span></div>
    <div class="fact"><b>${r0(c.cloud_cover)} %</b><span>Nubes · humedad ${r0(c.relative_humidity_2m)} %</span></div>
    <div class="fact"><b>${fl!=null?r0(fl)+" m":"–"}</b><span>Cota de nieve/0 °C aprox.</span></div>
  </div>
  <h2>Próximas 36 horas</h2><div class="strip">${hrs}</div>
  <p class="hint" style="margin:4px 0 0">Lluvia en mm por hora y probabilidad · viento medio en km/h (la flecha indica hacia dónde sopla).</p>
  <h2>7 días</h2><div class="wrap"><table><tr><th>Día</th><th></th><th>Mín / Máx</th><th>Lluvia</th><th>Viento (rachas)</th></tr>${days}</table></div>
  ${cmp?compareTable(cmp):""}`;
}

function compareTable(j){
  const M=[["ecmwf_ifs025","ECMWF"],["icon_seamless","ICON (DWD)"],["meteofrance_seamless","AROME/ARPEGE"],["gfs_seamless","GFS (EEUU)"]];
  const d=j.daily;let rows="";
  d.time.forEach((t,i)=>{rows+=`<tr><th colspan="4">${i===0?"Hoy":dayName(t)}</th></tr>`;
    M.forEach(([k,n])=>{const mx=d["temperature_2m_max_"+k],mn=d["temperature_2m_min_"+k],p=d["precipitation_sum_"+k],g=d["wind_gusts_10m_max_"+k];
      if(!mx)return;rows+=`<tr><td>${n}</td><td class="mono">${r0(mn[i])}° / ${r0(mx[i])}°</td><td class="mono rain">${p[i]>0?r1(p[i])+" mm":"–"}</td><td class="mono">${r0(g[i])} km/h</td></tr>`})});
  return `<h2>Qué dice cada modelo</h2><p class="hint" style="margin-top:0">Son los modelos que usan las apps del tiempo (AEMET, Windy, Meteoblue…). Si coinciden, la previsión es fiable; si no, hay duda.</p>
  <div class="wrap"><table><tr><th>Modelo</th><th>Mín / Máx</th><th>Lluvia</th><th>Rachas</th></tr>${rows}</table></div>`}

function dayName(t){const d=new Date(t.slice(0,10)+"T12:00");return d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric"})}

/* ---- Modo subida ---- */
let routeData=null;
function drawRoute(){routeLayer.clearLayers();routePts.forEach((p,i)=>L.circleMarker([p[0],p[1]],{radius:7,color:"#c8501e",fillColor:"#fff",fillOpacity:1,weight:3}).bindTooltip(p[2]).addTo(routeLayer));
  if(routePts.length>1)L.polyline(routePts.map(p=>[p[0],p[1]]),{color:"#c8501e",weight:3,dashArray:"6 6"}).addTo(routeLayer)}
function loadSubida(){routePts=SUBIDA.map(p=>[...p]);drawRoute();map.fitBounds(routeLayer.getLayers().length?L.latLngBounds(routePts.map(p=>[p[0],p[1]])).pad(.3):null);routeWeather()}
window.loadSubida=loadSubida;
async function routeWeather(){
  out.innerHTML=`<p class="hint">Cargando ${routePts.length} punto(s)…</p>`;
  try{
    const la=routePts.map(p=>p[0].toFixed(4)).join(","),lo=routePts.map(p=>p[1].toFixed(4)).join(",");
    let j=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&timezone=auto&forecast_days=3&hourly=${HOURLY}`);
    routeData=Array.isArray(j)?j:[j];
    const now=new Date();const nowKey=routeData[0].hourly.time.findIndex(t=>new Date(t)>=now);
    renderRoute(Math.max(0,nowKey));
  }catch{out.innerHTML=`<p class="err">No he podido cargar la ruta. Prueba de nuevo.</p>`}
}
function renderRoute(idx){
  const times=routeData[0].hourly.time;
  let rows="";
  routeData.forEach((f,i)=>{const h=f.hourly;const [ic,txt]=ico(h.weather_code[idx],h.is_day[idx]);
    rows+=`<tr><td><b>${routePts[i][2]}</b><br><span class="alt">${r0(f.elevation)} m</span></td><td style="font-size:20px" title="${txt}">${ic}</td>
    <td class="mono"><span class="${tcls(h.temperature_2m[idx])}">${r0(h.temperature_2m[idx])}°</span><br><small>sens. ${r0(h.apparent_temperature[idx])}°</small></td>
    <td class="mono rain">${h.snowfall[idx]>0?r1(h.snowfall[idx])+" cm❄":h.precipitation[idx]>0?r1(h.precipitation[idx])+" mm":"–"}<br><small>${h.precipitation_probability[idx]??"–"}%</small></td>
    <td class="mono">${arrow(h.wind_direction_10m[idx])} ${r0(h.wind_speed_10m[idx])}<br><small>rachas ${r0(h.wind_gusts_10m[idx])}</small></td></tr>`});
  const t=times[idx];
  out.innerHTML=`<h1>Tiempo en la subida</h1>
  <div class="meta">${routePts.length} punto(s) · pincha en el mapa para añadir más</div>
  <h2>Hora: ${dayName(t)} · ${t.slice(11,16)}</h2>
  <input type="range" id="hr" min="0" max="${times.length-1}" value="${idx}" aria-label="Hora">
  <div class="wrap"><table><tr><th>Punto</th><th></th><th>Temp.</th><th>Lluvia</th><th>Viento km/h</th></tr>${rows}</table></div>
  <div class="row"><button class="btn" id="clr">Borrar puntos</button><button class="btn" onclick="loadSubida()">Subida al Ocejón</button></div>
  <p class="hint">Mueve la barra para ver cómo cambia a lo largo del día: así sabes a qué hora te conviene estar arriba.</p>`;
  $("hr").oninput=e=>renderRoute(+e.target.value);
  $("clr").onclick=()=>setMode("route");
}

/* ---- Buscador ---- */
let st;
$("q").addEventListener("input",e=>{clearTimeout(st);const v=e.target.value.trim();if(v.length<3){$("res").hidden=true;return}
  st=setTimeout(async()=>{try{const j=await getJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=es&q=${encodeURIComponent(v)}`);
    $("res").innerHTML=j.map(p=>`<button data-la="${p.lat}" data-lo="${p.lon}" data-n="${(p.name||p.display_name).replace(/"/g,"")}">${p.display_name}</button>`).join("")||`<button disabled>Sin resultados</button>`;
    $("res").hidden=false}catch{}},450)});
$("res").addEventListener("click",e=>{const b=e.target.closest("button[data-la]");if(!b)return;const la=+b.dataset.la,lo=+b.dataset.lo;
  $("res").hidden=true;$("q").value=b.dataset.n;map.setView([la,lo],13);
  if(mode==="route"){routePts.push([la,lo,b.dataset.n]);drawRoute();routeWeather()}else pointWeather(la,lo,b.dataset.n)});

// Arranca enseñando el Ocejón
pointWeather(OCEJON.lat,OCEJON.lon,OCEJON.name);
</script>
</body>
</html>
